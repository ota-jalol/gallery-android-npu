name: Auto Bump Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump versionCode and versionName
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump versions in app/build.gradle.kts
        id: bump
        run: |
          FILE="Android/src/app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            echo "File not found: $FILE" >&2
            exit 1
          fi

          old_code=$(grep -m1 "versionCode" "$FILE" | awk '{print $3}')
          old_name=$(grep -m1 "versionName" "$FILE" | awk -F'"' '{print $2}')

          python - <<'PY'
import re, pathlib
file = pathlib.Path('Android/src/app/build.gradle.kts')
text = file.read_text()

code_match = re.search(r"versionCode\s*=\s*(\d+)", text)
name_match = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
if not code_match or not name_match:
    raise SystemExit('versionCode/versionName not found in expected format')
code = int(code_match.group(1))
name = name_match.group(1)

major, minor, patch = map(int, name.split('.'))
patch += 1
new_name = f"{major}.{minor}.{patch}"
new_code = code + 1

text = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {new_code}", text)
text = re.sub(r'versionName\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"', f'versionName = "{new_name}"', text)
file.write_text(text)
print(f"old_code={code}\nnew_code={new_code}\nold_name={name}\nnew_name={new_name}")
PY

          new_code=$(grep -m1 "versionCode" "$FILE" | awk '{print $3}')
          new_name=$(grep -m1 "versionName" "$FILE" | awk -F'"' '{print $2}')

          echo "new_code=$new_code" >> $GITHUB_OUTPUT
          echo "new_name=$new_name" >> $GITHUB_OUTPUT
          echo "Bumped: code $old_code -> $new_code, name $old_name -> $new_name"

      - name: Commit and push
        env:
          NEW_NAME: ${{ steps.bump.outputs.new_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add Android/src/app/build.gradle.kts
          git commit -m "chore: bump version to ${NEW_NAME} [skip-bump]"
          git push

      - name: Summary
        run: |
          echo "## ✅ Version bumped" >> $GITHUB_STEP_SUMMARY
          echo "- New versionName: ${{ steps.bump.outputs.new_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- New versionCode: ${{ steps.bump.outputs.new_code }}" >> $GITHUB_STEP_SUMMARY

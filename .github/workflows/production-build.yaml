name: Build APK on Production Push

on:
  push:
    branches:
      - production
    paths:
      - 'Android/**'
      - '.github/workflows/production-build.yaml'

jobs:
  build:
    name: Build Production APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Android/src
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Get version info
        id: version
        run: |
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk '{print $3}')
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "📱 Building version $VERSION_NAME ($VERSION_CODE)"
      
      - name: Build Release APK
        run: |
          echo "🔨 Building release APK..."
          ./gradlew assembleRelease --stacktrace
      
      - name: Find and rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_DIR=$(dirname "$APK_PATH")
          NEW_NAME="gallery-npu-v${{ steps.version.outputs.version_name }}-build-${{ github.run_number }}.apk"
          mv "$APK_PATH" "$APK_DIR/$NEW_NAME"
          echo "apk_path=$APK_DIR/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "✅ APK built: $NEW_NAME"
          ls -lh "$APK_DIR/$NEW_NAME"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
      
      - name: Create build summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **Name**: ${{ steps.apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Download**: Available in Actions artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To create a release, push a tag: \`git tag v${{ steps.version.outputs.version_name }} && git push origin v${{ steps.version.outputs.version_name }}\`" >> $GITHUB_STEP_SUMMARY

name: Build APK on Production Push

on:
  push:
    branches:
      - production
    paths:
      - 'Android/**'
      - '.github/workflows/production-build.yaml'
  workflow_dispatch:

jobs:
  build:
    name: Build Production APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Android/src
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Get version info
        id: version
        run: |
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk '{print $3}')
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "📱 Building version $VERSION_NAME ($VERSION_CODE)"
      
      - name: Build Release APK
        run: |
          echo "🔨 Building release APKs..."
          ./gradlew assembleRelease --stacktrace
      
      - name: List and rename APKs
        id: apk
        run: |
          echo "📦 Renaming APK files..."
          cd app/build/outputs/apk/release
          
          for apk in *.apk; do
            base_name="gallery-npu-v${{ steps.version.outputs.version_name }}-build-${{ github.run_number }}"
            if [[ $apk == *"universal"* ]]; then
              new_name="${base_name}-universal.apk"
            elif [[ $apk == *"armeabi-v7a"* ]]; then
              new_name="${base_name}-armeabi-v7a.apk"
            elif [[ $apk == *"arm64-v8a"* ]]; then
              new_name="${base_name}-arm64-v8a.apk"
            elif [[ $apk == *"x86_64"* ]]; then
              new_name="${base_name}-x86_64.apk"
            elif [[ $apk == *"x86"* ]]; then
              new_name="${base_name}-x86.apk"
            else
              new_name="${base_name}-$apk"
            fi
            mv "$apk" "$new_name"
            echo "✅ Renamed: $apk -> $new_name"
            ls -lh "$new_name"
          done
          
          echo "apk_dir=$(pwd)" >> $GITHUB_OUTPUT
          echo "artifact_name=gallery-npu-apks-v${{ steps.version.outputs.version_name }}-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: Android/src/app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Create build summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Name**: ${{ steps.apk.outputs.artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs**: Universal + ABI-specific (arm64-v8a, armeabi-v7a, x86_64, x86)" >> $GITHUB_STEP_SUMMARY
          echo "- **Download**: Available in Actions artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To create a release, push a tag: \`git tag v${{ steps.version.outputs.version_name }} && git push origin v${{ steps.version.outputs.version_name }}\`" >> $GITHUB_STEP_SUMMARY

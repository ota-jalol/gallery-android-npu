name: Build and Release APK

on:
  push:
    branches:
      - production
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: ./Android/src
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version (versionCode +1, patch +1)
        id: bump
        run: |
          FILE="app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            echo "File not found: $FILE" >&2
            exit 1
          fi

              python - <<'PY'
              import re, pathlib
              file = pathlib.Path('app/build.gradle.kts')
              text = file.read_text()

              code_match = re.search(r"versionCode\s*=\s*(\d+)", text)
              name_match = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
              if not code_match or not name_match:
                raise SystemExit('versionCode/versionName not found in expected format')
              code = int(code_match.group(1))
              name = name_match.group(1)

              major, minor, patch = map(int, name.split('.'))
              patch += 1
              new_name = f"{major}.{minor}.{patch}"
              new_code = code + 1

              text = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {new_code}", text)
              text = re.sub(r'versionName\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"', f'versionName = "{new_name}"', text)
              file.write_text(text)
              print(f"old_code={code}\nnew_code={new_code}\nold_name={name}\nnew_name={new_name}")
        PY

          VERSION_CODE=$(grep -m1 "versionCode" "$FILE" | awk '{print $3}')
          VERSION_NAME=$(grep -m1 "versionName" "$FILE" | awk -F'"' '{print $2}')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Bumped to versionName=$VERSION_NAME versionCode=$VERSION_CODE"
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
      
      - name: List and Rename APKs
        id: rename_apks
        run: |
          echo "📦 Renaming APK files..."
          cd app/build/outputs/apk/release
          
          # Rename each APK with version info
          for apk in *.apk; do
            if [[ $apk == *"universal"* ]]; then
              new_name="gallery-npu-v${{ steps.bump.outputs.version_name }}-universal.apk"
            elif [[ $apk == *"armeabi-v7a"* ]]; then
              new_name="gallery-npu-v${{ steps.bump.outputs.version_name }}-armeabi-v7a.apk"
            elif [[ $apk == *"arm64-v8a"* ]]; then
              new_name="gallery-npu-v${{ steps.bump.outputs.version_name }}-arm64-v8a.apk"
            elif [[ $apk == *"x86_64"* ]]; then
              new_name="gallery-npu-v${{ steps.bump.outputs.version_name }}-x86_64.apk"
            elif [[ $apk == *"x86"* ]]; then
              new_name="gallery-npu-v${{ steps.bump.outputs.version_name }}-x86.apk"
            else
              new_name="gallery-npu-v${{ steps.bump.outputs.version_name }}-$apk"
            fi
            mv "$apk" "$new_name"
            echo "✅ Renamed: $apk -> $new_name"
            ls -lh "$new_name"
          done
          
          echo "apk_dir=$(pwd)" >> $GITHUB_OUTPUT
      
      - name: Generate release tag
        id: generate_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${{ steps.bump.outputs.version_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Release ${{ steps.generate_tag.outputs.tag_name }}
          body: |
            ## Gallery Android NPU - Release ${{ steps.generate_tag.outputs.tag_name }}
            
            ### What's New
            - NPU (Neural Processing Unit) hardware acceleration support via NNAPI
            - Improved inference performance on compatible devices
            - User-selectable accelerator options (CPU/GPU/NPU)
            
            ### Version Information
            - **Version**: ${{ steps.bump.outputs.version_name }}
            - **Version Code**: ${{ steps.bump.outputs.version_code }}
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: ${{ github.sha }}
            
            ### Installation
            1. Download the APK file below
            2. Enable "Install from Unknown Sources" in your Android device settings
            3. Install the APK
            4. Launch the app and enjoy NPU-accelerated AI inference!
            
            ### Requirements
            - Android 12 (API 31) or higher
            - NPU support requires Android API 27+ (optimal on API 29+)
            - Device with NPU hardware for hardware acceleration
            
            ### Documentation
            - [NPU Support Guide](https://github.com/${{ github.repository }}/blob/${{ steps.generate_tag.outputs.tag_name }}/NPU_SUPPORT.md)
            - [Implementation Summary](https://github.com/${{ github.repository }}/blob/${{ steps.generate_tag.outputs.tag_name }}/IMPLEMENTATION_SUMMARY.md)
            
            ---
            
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ steps.generate_tag.outputs.tag_name }}
          files: |
            Android/src/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-npu-apks-v${{ steps.bump.outputs.version_name }}
          path: Android/src/app/build/outputs/apk/release/*.apk
          retention-days: 90
